name: ferrite-release

# Builds Ferrite's Linux packages and publishes them as a GitHub release
# tagged ferrite-v<version> (version from Cargo.toml). Run it by
# pushing such a tag, or manually with publish=true (creates the tag on the
# commit it runs on). A manual run with publish=false only uploads artifacts.
#
# edition=mcp builds Ferrite-mcp (the edition for AI clients, see
# scripts/package.sh) and publishes it as ferrite-mcp-v<version>.
#
# arch=arm64 builds on GitHub's arm64 runner and adds the arm64 .deb to
# the same release (checksums in SHA256SUMS-arm64). Run amd64 first: it
# creates the release.

on:
  push:
    tags:
      - "ferrite-v*"
      - "ferrite-mcp-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (tag ferrite-v<version>, or ferrite-mcp-v<version> for edition=mcp)"
        type: boolean
        default: false
      edition:
        description: "standard (Ferrite) or mcp (Ferrite-mcp)"
        type: choice
        options: [standard, mcp]
        default: standard
      arch:
        description: "amd64 or arm64 (arm64 adds packages to the existing release)"
        type: choice
        options: [amd64, arm64]
        default: amd64

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # A pushed ferrite-mcp-v* tag means the mcp edition.
  EDITION: ${{ inputs.edition || (startsWith(github.ref_name, 'ferrite-mcp-v') && 'mcp') || 'standard' }}

jobs:
  release:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies
        # The runner image already has most of these (it ships Chrome). Install
        # only what is missing; GitHub's Ubuntu mirrors sometimes hang, so apt
        # gets short timeouts and the step a time limit, and a failed install
        # does not stop the build (a real missing library fails it later).
        timeout-minutes: 6
        continue-on-error: true
        run: |
          missing=""
          for p in cmake ninja-build g++ pkg-config librsvg2-bin libnss3 libgbm1 libasound2t64; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          echo "missing:${missing:- none}"
          [ -z "$missing" ] && exit 0
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends $missing
      - name: Version
        id: version
        run: |
          VERSION="$(awk -F'"' '/^\[workspace.package\]/ {p=1} p && /^version/ {print $2; exit}' Cargo.toml)"
          if [ "$EDITION" = mcp ]; then
            TAG="ferrite-mcp-v${VERSION}"; NAME="Ferrite-mcp ${VERSION}"; NOTES=packaging/RELEASE_NOTES-mcp.md
          else
            TAG="ferrite-v${VERSION}"; NAME="Ferrite ferrite-v${VERSION}"; NOTES=packaging/RELEASE_NOTES.md
          fi
          { echo "tag=$TAG"; echo "name=$NAME"; echo "notes=$NOTES"; } >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${VERSION}"; exit 1
          fi

      - name: Install CEF
        run: scripts/setup-cef.sh

      - name: Test
        # Newer cargo puts test binaries under target/*/build/<pkg>/<hash>/out, where
        # the $ORIGIN rpath can't find libcef.so: point the loader at CEF directly.
        run: |
          export CEF_PATH=$HOME/.local/share/cef LD_LIBRARY_PATH=$HOME/.local/share/cef
          if [ "$EDITION" = mcp ]; then
            cargo test --release --workspace --features ferrite/mcp-edition,ferrite-mcp/mcp-edition
          else
            cargo test --release --workspace
          fi

      - name: Package (.deb and AppImage)
        run: |
          export CEF_PATH=$HOME/.local/share/cef
          if [ "$(dpkg --print-architecture)" = arm64 ]; then
            scripts/package.sh --deb-only && SUMS=SHA256SUMS-arm64
          else
            scripts/package.sh && SUMS=SHA256SUMS
          fi
          cd dist && sha256sum *.deb $(ls *.AppImage 2>/dev/null) > "$SUMS" && cat "$SUMS"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          body_path: ${{ steps.version.outputs.notes }}
          # Only Ferrite itself is the repository's "Latest" release.
          make_latest: ${{ env.EDITION == 'mcp' && 'false' || 'true' }}
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS*

      - name: Keep packages (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: ferrite-packages-${{ env.EDITION }}-${{ inputs.arch || 'amd64' }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS*
